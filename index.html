<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Car Evolve — Infinite Drive</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;font-family:Arial,sans-serif;background:#87ceeb}canvas{display:block;width:100%;height:100%;touch-action:none}#hud{position:absolute;top:14px;left:14px;z-index:2;color:#fff;text-shadow:0 2px 4px #182318;font-weight:bold;pointer-events:none}.stat{background:#17251ddd;border:1px solid #ffffff55;border-radius:10px;padding:8px 12px;margin-bottom:7px;min-width:145px}#shop{position:absolute;right:14px;top:14px;z-index:3;width:min(250px,calc(100vw - 28px));max-height:calc(100vh - 185px);overflow:auto;padding:12px;background:#17251ded;color:#fff;border:1px solid #ffffff55;border-radius:12px;box-shadow:0 4px 18px #0005}#shop h2{font-size:17px;margin:0 0 7px}#shop p{margin:0 0 9px;font-size:12px;color:#d9e8d4;line-height:1.35}.upgrade{width:100%;margin:4px 0;padding:9px 8px;border:0;border-radius:7px;background:#e6ad3b;color:#1c2117;font-weight:bold;text-align:left;cursor:pointer}.upgrade:hover:not(:disabled){background:#ffd06a}.upgrade:disabled{background:#777;color:#ddd;cursor:not-allowed}#help{position:absolute;left:14px;bottom:14px;z-index:2;max-width:min(360px,calc(100vw - 28px));padding:10px 12px;border-radius:9px;background:#17251ddd;color:white;font-size:13px;line-height:1.5}#slingshot{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);z-index:3;text-align:center;color:#fff;text-shadow:0 2px 4px #000;font-weight:bold;pointer-events:none}#slingshotArea{position:relative;width:124px;height:100px;margin:auto;border:2px dashed #ffffffbb;border-radius:14px;background:#17251d88;touch-action:none;pointer-events:auto}#slingshotCenter,#slingshotHandle{position:absolute;width:24px;height:24px;border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%)}#slingshotCenter{background:#eee;opacity:.8}#slingshotHandle{background:#e53e35;border:3px solid white;box-shadow:0 2px 7px #000;touch-action:none;cursor:grab}#slingshotText{font-size:12px;margin-top:5px;max-width:230px}#toast{position:absolute;top:24px;left:50%;transform:translateX(-50%);padding:10px 16px;border-radius:9px;background:#18251de8;color:white;z-index:4;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}#reset{position:absolute;left:14px;top:145px;z-index:3;border:0;border-radius:7px;padding:9px 11px;font-weight:bold;cursor:pointer}@media(max-width:600px){#hud{top:8px;left:8px}.stat{min-width:115px;padding:7px 9px;font-size:13px}#shop{top:8px;right:8px;width:190px;padding:9px;max-height:42vh}#shop h2{font-size:15px}#shop p{font-size:11px}.upgrade{font-size:11px;padding:7px 6px}#reset{top:auto;bottom:125px;left:8px}#help{left:8px;bottom:8px;max-width:calc(100vw - 16px);font-size:11px;padding:7px 9px}#slingshot{bottom:8px;left:auto;right:8px;transform:none}#slingshotArea{width:100px;height:82px}#slingshotText{max-width:130px;font-size:10px}}
</style>
</head>
<body>
<div id="hud"><div class="stat" id="money">$250</div><div class="stat" id="distance">0.00 mi</div><div class="stat" id="speed">0 MPH</div></div>
<div id="shop"><h2>Garage upgrades</h2><p>Earn $10 every 50 m. Income upgrades increase each payout. Your money and upgrades stay after each run.</p><button class="upgrade" id="slingUpgrade"></button><button class="upgrade" id="engineUpgrade"></button><button class="upgrade" id="wheelsUpgrade"></button><button class="upgrade" id="frameUpgrade"></button><button class="upgrade" id="incomeUpgrade"></button></div>
<button id="reset">RESET RUN</button><div id="help">A / D or ← / → to steer<br>Pull the red handle down and release to launch<br>Runs reset when the car stops. Your money stays!</div>
<div id="slingshot"><div id="slingshotArea"><div id="slingshotCenter"></div><div id="slingshotHandle"></div></div><div id="slingshotText">Pull down and release to launch</div></div><div id="toast"></div>
<script type="module">
import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x87ceeb);scene.fog=new THREE.Fog(0x87ceeb,650,2600);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,5000);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xdff4ff,0x40542c,2));const sun=new THREE.DirectionalLight(0xffffff,2.4);sun.position.set(100,250,100);sun.castShadow=true;scene.add(sun);
const chunkSize=300,chunkDepth=1500,chunks=new Map(),bridges=[];
function heightAt(x,z=0){if(x<=80)return 0;const t=THREE.MathUtils.clamp((x-80)/460,0,1),smooth=t*t*(3-2*t),ramp=-25*smooth,rolling=x>540?7*Math.sin((x-540)*.009)+3*Math.sin((x-540)*.023):0;return ramp+rolling+Math.max(0,Math.abs(z)-100)*.018;}
function makeTerrainChunk(index){const root=new THREE.Group();root.position.x=index*chunkSize;scene.add(root);const verts=[],colors=[],indices=[],nx=30,nz=24,grass=new THREE.Color(0x618b43),hill=new THREE.Color(0x789354);for(let i=0;i<=nx;i++)for(let j=0;j<=nz;j++){const lx=chunkSize*i/nx,z=-chunkDepth/2+chunkDepth*j/nz,y=heightAt(index*chunkSize+lx,z);verts.push(lx,y,z);const c=grass.clone().lerp(hill,THREE.MathUtils.clamp((y+45)/110,0,1));colors.push(c.r,c.g,c.b);}for(let i=0;i<nx;i++)for(let j=0;j<nz;j++){const a=i*(nz+1)+j,b=a+nz+1;indices.push(a,a+1,b,b,a+1,b+1);}const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));geo.setAttribute('color',new THREE.Float32BufferAttribute(colors,3));geo.setIndex(indices);geo.computeVertexNormals();const ground=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({vertexColors:true,roughness:1}));ground.receiveShadow=true;root.add(ground);
 const rv=[],ri=[],steps=30,across=8,width=100;for(let i=0;i<=steps;i++){const lx=chunkSize*i/steps,x=index*chunkSize+lx;for(let j=0;j<=across;j++){const z=-width/2+width*j/across;rv.push(lx,heightAt(x,z)+.7,z);}}for(let i=0;i<steps;i++)for(let j=0;j<across;j++){const a=i*(across+1)+j,b=a+across+1;ri.push(a,b,a+1,b,b+1,a+1);}const rg=new THREE.BufferGeometry();rg.setAttribute('position',new THREE.Float32BufferAttribute(rv,3));rg.setIndex(ri);rg.computeVertexNormals();root.add(new THREE.Mesh(rg,new THREE.MeshStandardMaterial({color:0x9b805b,roughness:1,side:THREE.DoubleSide})));
 for(let n=0;n<8;n++){const x=chunkSize*(.1+Math.random()*.8),side=Math.random()<.5?-1:1,z=side*(130+Math.random()*350),tree=new THREE.Group();tree.position.set(x,heightAt(index*chunkSize+x,z),z);const trunk=new THREE.Mesh(new THREE.CylinderGeometry(1.1,1.5,9,7),new THREE.MeshStandardMaterial({color:0x684528}));trunk.position.y=4.5;tree.add(trunk);const crown=new THREE.Mesh(new THREE.ConeGeometry(7,18,8),new THREE.MeshStandardMaterial({color:0x276b2d}));crown.position.y=15;tree.add(crown);root.add(tree);}
 if(index%3===1){const x=index*chunkSize+chunkSize*.55,bridge=new THREE.Group();bridge.position.set(chunkSize*.55,heightAt(x,0)+3,0);const deck=new THREE.Mesh(new THREE.BoxGeometry(28,2,112),new THREE.MeshStandardMaterial({color:0x755137,roughness:.9}));bridge.add(deck);for(const z of [-54,54]){const rail=new THREE.Mesh(new THREE.BoxGeometry(28,3,2),new THREE.MeshStandardMaterial({color:0x493320}));rail.position.set(0,2,z);bridge.add(rail);}root.add(bridge);bridges.push({x,half:16});}chunks.set(index,root);}
const car=new THREE.Group();scene.add(car);function updateChunks(){const center=Math.floor(car.position.x/chunkSize);for(let i=center-2;i<=center+4;i++)if(!chunks.has(i))makeTerrainChunk(i);for(const [i,g] of chunks)if(i<center-3){scene.remove(g);g.traverse(o=>{if(o.geometry)o.geometry.dispose();});chunks.delete(i);}for(let i=bridges.length-1;i>=0;i--)if(bridges[i].x<car.position.x-800)bridges.splice(i,1);}
const dark=new THREE.MeshStandardMaterial({color:0x20252a,roughness:.75}),rubber=new THREE.MeshStandardMaterial({color:0x111111,roughness:.95}),metal=new THREE.MeshStandardMaterial({color:0x9b9b9b,metalness:.65,roughness:.4}),red=new THREE.MeshStandardMaterial({color:0xd43b2e,metalness:.2,roughness:.45});
let money=50,distance=0,lastPaidMilestone=0,speed=0,heading=0,launched=false,dragging=false,pullY=0,pullX=0,startX=0,startY=0,upgrades={sling:0,engine:0,wheels:0,frame:0,income:0};
function buildCar(){while(car.children.length){const o=car.children[0];car.remove(o);if(o.geometry)o.geometry.dispose();}const lvl=upgrades.frame,wheelRadius=.85+upgrades.wheels*.12,wheelX=2.1,wheelZ=1.45;const rail=new THREE.Mesh(new THREE.BoxGeometry(5.5,.24,.25),metal);rail.position.y=1.05;car.add(rail);for(const z of [-wheelZ,wheelZ]){const side=new THREE.Mesh(new THREE.BoxGeometry(4.5,.22,.2),metal);side.position.set(0,1.05,z);car.add(side);}for(const x of [-wheelX,wheelX])for(const z of [-wheelZ,wheelZ]){const wheel=new THREE.Mesh(new THREE.CylinderGeometry(wheelRadius,wheelRadius,.55,20),rubber);wheel.rotation.x=Math.PI/2;wheel.position.set(x,wheelRadius,z);car.add(wheel);const hub=new THREE.Mesh(new THREE.CylinderGeometry(wheelRadius*.43,wheelRadius*.43,.58,16),metal);hub.rotation.x=Math.PI/2;hub.position.copy(wheel.position);car.add(hub);}const seat=new THREE.Mesh(new THREE.BoxGeometry(1.3,1.1,1.5),dark);seat.position.set(-.5,1.9,0);car.add(seat);if(lvl>=2){const body=new THREE.Mesh(new THREE.BoxGeometry(6.4,1.05,3.55),red);body.position.set(.1,1.8,0);car.add(body);const hood=new THREE.Mesh(new THREE.BoxGeometry(2.2,.6,3.3),red);hood.position.set(2.1,2.55,0);car.add(hood);}if(lvl>=3){const cabin=new THREE.Mesh(new THREE.BoxGeometry(2.8,1.5,2.8),new THREE.MeshStandardMaterial({color:0x4f8190,transparent:true,opacity:.8,metalness:.2,roughness:.25}));cabin.position.set(-.55,3,0);car.add(cabin);}if(lvl>=4){const spoiler=new THREE.Mesh(new THREE.BoxGeometry(.4,.2,4.2),dark);spoiler.position.set(-3.1,2.6,0);car.add(spoiler);}}
const area=document.getElementById('slingshotArea'),handle=document.getElementById('slingshotHandle'),status=document.getElementById('slingshotText');const labels={sling:'Slingshot power',engine:'Engine',wheels:'Wheels',frame:'Car evolution',income:'Income boost'},prices=[0,20,45,80,130,200],incomePrices=[75,150,300,600,1200],incomeMultipliers=[1,1.1,1.2,1.4,1.7,2];function cost(level){return prices[Math.min(level+1,5)];}function incomeCost(level){return incomePrices[Math.min(level,4)];}function incomeMultiplier(level=upgrades.income){return incomeMultipliers[Math.min(level,5)];}function upgradeCost(key,level){return key==='income'?incomeCost(level):cost(level);}
function updateShop(){for(const key of Object.keys(labels)){const b=document.getElementById(key+'Upgrade'),level=upgrades[key],price=upgradeCost(key,level);b.textContent=key==='income'?`${labels[key]} · Lv ${level} — ${incomeMultiplier(level).toFixed(1)}× earnings — $${price}`:`${labels[key]} · Lv ${level} — $${price}`;b.disabled=money<price||level>=5;}}
function updateHUD(){document.getElementById('money').textContent=`$${Math.floor(money).toLocaleString()}`;document.getElementById('distance').textContent=`${distance.toFixed(2)} mi`;document.getElementById('speed').textContent=`${Math.max(0,Math.round(speed*2.237))} MPH`;updateShop();}
let toastTimer;function toast(message){const t=document.getElementById('toast');t.textContent=message;t.style.opacity=1;clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.style.opacity=0,1700);}
function resetRun(showMessage=false){car.position.set(0,.7,0);car.rotation.set(0,0,0);heading=0;speed=0;launched=false;dragging=false;distance=0;lastPaidMilestone=0;handle.style.left='50%';handle.style.top='50%';status.textContent='Pull down and release to launch';updateHUD();if(showMessage)toast('Run complete — money and upgrades saved!');}
function finishRun(){launched=false;speed=0;resetRun(true);}
for(const key of Object.keys(labels))document.getElementById(key+'Upgrade').addEventListener('click',()=>{const price=upgradeCost(key,upgrades[key]);if(money<price||upgrades[key]>=5)return;money-=price;upgrades[key]++;if(key==='frame'||key==='wheels')buildCar();toast(`${labels[key]} upgraded!`);updateHUD();});
function moveHandle(x,y){handle.style.left=`calc(50% + ${x}px)`;handle.style.top=`calc(50% + ${y}px)`;}area.addEventListener('pointerdown',e=>{if(launched)return;e.preventDefault();dragging=true;startX=e.clientX;startY=e.clientY;pullX=0;pullY=0;area.setPointerCapture(e.pointerId);});area.addEventListener('pointermove',e=>{if(!dragging)return;pullX=THREE.MathUtils.clamp(e.clientX-startX,-48,48);pullY=THREE.MathUtils.clamp(e.clientY-startY,0,62);moveHandle(pullX,pullY);});function releaseLaunch(){if(!dragging)return;dragging=false;const power=THREE.MathUtils.clamp(pullY/62,0,1);if(power>.04&&!launched){launched=true;heading=-pullX/48*.45;speed=power*(7+upgrades.sling*3+upgrades.engine*1.5);status.textContent=`Launched! You earn $${(10*incomeMultiplier()).toFixed(0)} every 50 m.`;}moveHandle(0,0);}area.addEventListener('pointerup',releaseLaunch);area.addEventListener('pointercancel',releaseLaunch);document.getElementById('reset').addEventListener('click',()=>resetRun());
const keys={};addEventListener('keydown',e=>{const key=e.key.toLowerCase();keys[key]=true;if(['arrowleft','arrowright',' '].includes(key))e.preventDefault();});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
let last=performance.now();function animate(now){requestAnimationFrame(animate);const dt=Math.min((now-last)/1000,.04);last=now;if(launched){const slope=(heightAt(car.position.x+2,car.position.z)-heightAt(car.position.x-2,car.position.z))/4,rollingResistance=.22+speed*.01;speed=Math.max(0,speed+(-slope*9.81-rollingResistance)*dt);if(keys.a||keys.arrowleft)heading+=dt*(.9+speed*.018);if(keys.d||keys.arrowright)heading-=dt*(.9+speed*.018);const dx=Math.cos(heading)*speed*dt,dz=Math.sin(heading)*speed*dt;car.position.x+=dx;car.position.z=THREE.MathUtils.clamp(car.position.z+dz,-650,650);car.position.y=heightAt(car.position.x,car.position.z)+.7;distance=Math.max(distance,Math.max(0,car.position.x)/1609.34);const milestone=Math.floor(distance*1609.34/50);if(milestone>lastPaidMilestone){const earned=(milestone-lastPaidMilestone)*10*incomeMultiplier();money+=earned;lastPaidMilestone=milestone;toast(`+$${earned.toFixed(0)} earned!`);}if(bridges.some(b=>Math.abs(car.position.x-b.x)<b.half&&Math.abs(car.position.z)<55))speed=Math.max(0,speed-8*dt);if(speed<=.02&&distance>0.0001)finishRun();}
 updateChunks();car.rotation.y=-heading;car.rotation.z=launched?THREE.MathUtils.clamp((heightAt(car.position.x+3,car.position.z)-heightAt(car.position.x-3,car.position.z))*.025,-.35,.35):0;const cameraPos=new THREE.Vector3(car.position.x-30,car.position.y+20,car.position.z+40);camera.position.lerp(cameraPos,.07);camera.lookAt(car.position.x+12,car.position.y+4,car.position.z);updateHUD();renderer.render(scene,camera);}
buildCar();resetRun();updateChunks();requestAnimationFrame(animate);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script></body></html>

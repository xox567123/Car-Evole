<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Car Evolve — Infinite Drive</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;font-family:Arial,sans-serif;background:#87ceeb}canvas{display:block;width:100%;height:100%;touch-action:none}#hud{position:absolute;top:14px;left:14px;z-index:2;color:#fff;text-shadow:0 2px 4px #182318;font-weight:bold;pointer-events:none}.stat{background:#17251ddd;border:1px solid #ffffff55;border-radius:10px;padding:8px 12px;margin-bottom:7px;min-width:145px}#shop{position:absolute;right:14px;top:14px;z-index:3;width:min(250px,calc(100vw - 28px));max-height:calc(100vh - 185px);overflow:auto;padding:12px;background:#17251ded;color:white;border:1px solid #ffffff55;border-radius:12px;box-shadow:0 4px 18px #0005}#shop h2{font-size:17px;margin:0 0 7px}#shop p{margin:0 0 9px;font-size:12px;color:#d9e8d4;line-height:1.35}.upgrade{width:100%;margin:4px 0;padding:9px 8px;border:0;border-radius:7px;background:#e6ad3b;color:#1c2117;font-weight:bold;text-align:left;cursor:pointer}.upgrade:hover:not(:disabled){background:#ffd06a}.upgrade:disabled{background:#777;color:#ddd;cursor:not-allowed}#help{position:absolute;left:14px;bottom:14px;z-index:2;max-width:min(360px,calc(100vw - 28px));padding:10px 12px;border-radius:9px;background:#17251ddd;color:white;font-size:13px;line-height:1.5}#slingshot{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);z-index:3;text-align:center;color:#fff;text-shadow:0 2px 4px #000;font-weight:bold;touch-action:none}#slingshotArea{position:relative;width:124px;height:100px;margin:auto;border:2px dashed #ffffffbb;border-radius:14px;background:#17251d88;touch-action:none;pointer-events:auto}#slingshotCenter,#slingshotHandle{position:absolute;width:24px;height:24px;border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%)}#slingshotCenter{background:#eee;opacity:.8}#slingshotHandle{background:#e53e35;border:3px solid white;box-shadow:0 2px 7px #000;touch-action:none;cursor:grab}#slingshotText{font-size:12px;margin-top:5px;max-width:230px}#toast{position:absolute;top:24px;left:50%;transform:translateX(-50%);padding:10px 16px;border-radius:9px;background:#18251de8;color:white;z-index:4;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}#reset{position:absolute;left:14px;top:145px;z-index:3;border:0;border-radius:7px;padding:9px 11px;font-weight:bold;cursor:pointer}@media(max-width:600px){#hud{top:8px;left:8px}.stat{min-width:115px;padding:7px 9px;font-size:13px}#shop{top:8px;right:8px;width:190px;padding:9px;max-height:42vh}#shop h2{font-size:15px}#shop p{font-size:11px}.upgrade{font-size:11px;padding:7px 6px}#reset{top:auto;bottom:125px;left:8px}#help{left:8px;bottom:8px;max-width:calc(100vw - 16px);font-size:11px;padding:7px 9px}#slingshot{bottom:8px;left:auto;right:8px;transform:none}#slingshotArea{width:100px;height:82px}#slingshotText{max-width:130px;font-size:10px}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud"><div class="stat" id="money">$50</div><div class="stat" id="distance">0 m</div><div class="stat" id="speed">0 m/s</div></div>
<div id="shop"><h2>Garage upgrades</h2><p>Earn $20 every 50 m. Your money and upgrades stay after each run.</p><button class="upgrade" id="incomeUpgrade"></button><button class="upgrade" id="slingUpgrade"></button><button class="upgrade" id="engineUpgrade"></button><button class="upgrade" id="wheelsUpgrade"></button><button class="upgrade" id="frameUpgrade"></button></div>
<button id="reset">RESET RUN</button><div id="help">A / D or ← / → to steer<br>Pull the red handle down and release to launch<br>Runs reset when the car stops. Your money stays!</div>
<div id="slingshot"><div id="slingshotArea"><div id="slingshotCenter"></div><div id="slingshotHandle"></div></div><div id="slingshotText">Pull down and release to launch</div></div><div id="toast"></div>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');let width=innerWidth,height=innerHeight,dpr=1;function resize(){dpr=Math.min(devicePixelRatio||1,2);width=innerWidth;height=innerHeight;canvas.width=width*dpr;canvas.height=height*dpr;canvas.style.width=width+'px';canvas.style.height=height+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
let money=50,distance=0,lastPaidMilestone=0,speed=0,heading=0,launched=false,dragging=false,pullY=0,pullX=0,startX=0,startY=0,carX=0,upgrades={income:0,sling:0,engine:0,wheels:0,frame:0};
const labels={income:'Income multiplier',sling:'Slingshot power',engine:'Engine',wheels:'Wheels',frame:'Car evolution'};const prices={income:[75,120,190,300,475,750,1185,1875,2965,4685],sling:[20,45,80,130,200],engine:[20,45,80,130,200],wheels:[20,45,80,130,200],frame:[20,45,80,130,200]};function cost(key){const level=upgrades[key];if(key==='income')return prices.income[level]??Math.round(prices.income.at(-1)*1.6**(level-prices.income.length+1));return prices[key][Math.min(level,prices[key].length-1)]}function incomeMultiplier(level=upgrades.income){if(level===0)return 1;return level%5===0?1+level/5:1+((level%5)/10)}
function updateShop(){for(const key of Object.keys(labels)){const b=document.getElementById(key+'Upgrade'),level=upgrades[key];b.textContent=key==='income'?`${labels[key]} · Lv ${level} — ${incomeMultiplier().toFixed(1)}× — $${cost(key)}`:`${labels[key]} · Lv ${level} — $${cost(key)}`;b.disabled=money<cost(key)||(key!=='income'&&level>=5)}}function updateHUD(){document.getElementById('money').textContent=`$${Math.floor(money).toLocaleString()}`;document.getElementById('distance').textContent=`${distance.toFixed(1)} m`;document.getElementById('speed').textContent=`${Math.max(0,Math.round(speed))} m/s`;updateShop()}
let toastTimer;function toast(message){const t=document.getElementById('toast');t.textContent=message;t.style.opacity=1;clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.style.opacity=0,1700)}function resetRun(showMessage=false){speed=0;launched=false;dragging=false;distance=0;lastPaidMilestone=0;carX=0;heading=0;handle.style.left='50%';handle.style.top='50%';status.textContent='Pull down and release to launch';updateHUD();if(showMessage)toast('Run complete — money and upgrades saved!')}function finishRun(){launched=false;speed=0;resetRun(true)}
for(const key of Object.keys(labels))document.getElementById(key+'Upgrade').addEventListener('click',()=>{const price=cost(key);if(money<price||(key!=='income'&&upgrades[key]>=5))return;money-=price;upgrades[key]++;toast(key==='income'?`Income upgrade! Multiplier: ${incomeMultiplier().toFixed(1)}×`:`${labels[key]} upgraded!`);updateHUD()});
const area=document.getElementById('slingshotArea'),handle=document.getElementById('slingshotHandle'),status=document.getElementById('slingshotText');function moveHandle(x,y){handle.style.left=`calc(50% + ${x}px)`;handle.style.top=`calc(50% + ${y}px)`}area.addEventListener('pointerdown',e=>{if(launched)return;e.preventDefault();dragging=true;startX=e.clientX;startY=e.clientY;pullX=0;pullY=0;area.setPointerCapture(e.pointerId)});area.addEventListener('pointermove',e=>{if(!dragging)return;pullX=Math.max(-48,Math.min(48,e.clientX-startX));pullY=Math.max(0,Math.min(62,e.clientY-startY));moveHandle(pullX,pullY)});function release(){if(!dragging)return;dragging=false;const power=Math.max(0,Math.min(1,pullY/62));if(power>.04&&!launched){launched=true;heading=-pullX/48*.45;speed=power*(36+upgrades.sling*5+upgrades.engine*2);status.textContent=`Launched! Earn $20 every 50 m (×${incomeMultiplier().toFixed(1)})`;}moveHandle(0,0)}area.addEventListener('pointerup',release);area.addEventListener('pointercancel',release);document.getElementById('reset').addEventListener('click',()=>resetRun());
const keys={};addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys[k]=true;if(['arrowleft','arrowright',' '].includes(k))e.preventDefault()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function draw(){ctx.clearRect(0,0,width,height);const sky=ctx.createLinearGradient(0,0,0,height);sky.addColorStop(0,'#83cceb');sky.addColorStop(.58,'#d7f0c4');sky.addColorStop(.59,'#648b43');sky.addColorStop(1,'#426331');ctx.fillStyle=sky;ctx.fillRect(0,0,width,height);const horizon=height*.59;ctx.fillStyle='#777b78';ctx.beginPath();ctx.moveTo(width*.38,horizon);ctx.lineTo(width*.62,horizon);ctx.lineTo(width*1.25,height);ctx.lineTo(-width*.25,height);ctx.closePath();ctx.fill();ctx.strokeStyle='#eee';ctx.lineWidth=4;ctx.setLineDash([25,25]);ctx.lineDashOffset=-(distance*8)%50;ctx.beginPath();ctx.moveTo(width*.5,horizon);ctx.lineTo(width*.5-carX*2,height);ctx.stroke();ctx.setLineDash([]);const carY=height*.79,carW=Math.min(100,width*.18),carH=carW*.48;ctx.save();ctx.translate(width*.5+carX,carY);ctx.rotate(-heading*.3);ctx.fillStyle='#171717';for(const x of [-.38,.38])for(const y of [-.38,.38]){ctx.fillRect(x*carW-carW*.08,y*carH-carH*.14,carW*.16,carH*.28)}ctx.fillStyle=upgrades.frame>=2?'#d43b2e':'#df4938';ctx.beginPath();ctx.roundRect(-carW/2,-carH/2,carW,carH,carH*.22);ctx.fill();ctx.fillStyle='#9dd9e8';ctx.beginPath();ctx.roundRect(-carW*.18,-carH*.4,carW*.36,carH*.8,6);ctx.fill();ctx.restore();if(!launched){ctx.fillStyle='#fff';ctx.font='bold 17px Arial';ctx.textAlign='center';ctx.fillText('Pull the handle to launch!',width/2,height*.7)} }
let last=performance.now();function animate(now){requestAnimationFrame(animate);const dt=Math.min((now-last)/1000,.04);last=now;if(launched){if(keys.a||keys.arrowleft)heading=Math.max(-.55,heading-dt*(.9+speed*.006));if(keys.d||keys.arrowright)heading=Math.min(.55,heading+dt*(.9+speed*.006));speed=Math.max(0,speed-(2.4+speed*.018)*dt);distance+=speed*dt;carX=Math.max(-width*.27,Math.min(width*.27,carX+Math.sin(heading)*speed*dt*5));const milestone=Math.floor(distance/50);if(milestone>lastPaidMilestone){const earned=(milestone-lastPaidMilestone)*20*incomeMultiplier();money+=earned;lastPaidMilestone=milestone;toast(`+$${earned.toFixed(0)} earned!`)}if(speed<=.02&&distance>.1)finishRun()}draw();updateHUD()}requestAnimationFrame(animate);
</script>
</body>
</html>

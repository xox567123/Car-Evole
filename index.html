<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valley Slingshot Driving</title>
<style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;font-family:Arial,sans-serif;background:#87ceeb}canvas{display:block}#hud{position:absolute;top:18px;left:18px;z-index:2;color:#fff;text-shadow:2px 2px 5px #000}#speedometer{width:120px;height:120px;border:4px solid white;border-radius:50%;background:#000a;position:relative}#needle{position:absolute;width:4px;height:48px;left:54px;top:12px;background:#f33;border-radius:5px;transform-origin:bottom center;transform:rotate(-130deg)}#speedText{text-align:center;font-size:21px;font-weight:bold;margin-top:8px}#slingshot{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);width:300px;height:145px;background:#0f190fe8;border:2px solid #fffc;border-radius:16px;color:white;text-align:center;padding:10px;z-index:3;user-select:none;touch-action:none}#slingshotTitle{font-size:17px;font-weight:bold;margin-bottom:5px}#slingshotArea{width:100%;height:78px;position:relative;border-radius:10px;background:linear-gradient(180deg,#ffffff18,#ffffff08);overflow:hidden;touch-action:none}#slingshotCenter,#slingshotHandle{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%}#slingshotCenter{width:14px;height:14px;background:white;border:3px solid #65d66b;pointer-events:none;z-index:2}#slingshotHandle{width:30px;height:30px;background:#ffb52e;border:3px solid white;box-shadow:0 0 12px #ffb52ecc;cursor:grab;z-index:3}#slingshotText{font-size:12px;margin-top:5px;color:#ddd}#resetButton{position:absolute;top:20px;right:20px;z-index:3;padding:12px 18px;color:white;background:#b52626;border:2px solid white;border-radius:8px;font-weight:bold;cursor:pointer}#help{position:absolute;right:20px;bottom:180px;color:white;background:#0009;padding:12px;border-radius:8px;font-size:13px;line-height:1.5;z-index:2}@media(max-width:600px){#help{right:10px;bottom:170px;font-size:11px;padding:8px}#slingshot{bottom:12px}}
</style>
</head>
<body>
<div id="hud"><div id="speedometer"><div id="needle"></div></div><div id="speedText">0 MPH</div></div>
<button id="resetButton">RESET CAR</button>
<div id="help">One slingshot launch only.<br>A / D or ← / → to steer.<br>Follow the bumpy path over the hills!</div>
<div id="slingshot"><div id="slingshotTitle">SLINGSHOT</div><div id="slingshotArea"><div id="slingshotCenter"></div><div id="slingshotHandle"></div></div><div id="slingshotText">Pull down and release to launch!</div></div>
<script type="module">
import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";
const scene=new THREE.Scene();scene.background=new THREE.Color(0x87ceeb);scene.fog=new THREE.Fog(0x87ceeb,500,3000);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,6000);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xd8efff,0x405b2a,2.1));const sun=new THREE.DirectionalLight(0xffffff,2.4);sun.position.set(200,350,100);scene.add(sun);
// Repeating steep rises and dips are centered on the route so the car must climb and descend hills.
function heightAt(x,z){const sideRise=105*(1-Math.exp(-Math.pow(Math.max(0,Math.abs(z)-85)/230,2)));const pathHills=(72*Math.sin(x*.0045)+15*Math.sin(x*.009+.35))*Math.exp(-Math.pow(z/520,2));const distantRoll=16*Math.sin(x*.00125)+4*Math.sin(x*.00255+.7);const cross=5*Math.sin(z*.008+x*.0006);return sideRise+pathHills+distantRoll+cross;}
function slopeAt(x,z){return{x:(heightAt(x+1,z)-heightAt(x-1,z))/2,z:(heightAt(x,z+1)-heightAt(x,z-1))/2};}
const groundGeo=new THREE.PlaneGeometry(5000,1400,400,120);groundGeo.rotateX(-Math.PI/2);const gp=groundGeo.attributes.position;const colors=[];const low=new THREE.Color(0x557c38),mid=new THREE.Color(0x78a94e),high=new THREE.Color(0x9aaf58);
for(let i=0;i<gp.count;i++){const x=gp.getX(i),z=gp.getZ(i),y=heightAt(x,z);gp.setY(i,y);const t=THREE.MathUtils.clamp((y+100)/260,0,1);const c=t<.55?low.clone().lerp(mid,t/.55):mid.clone().lerp(high,(t-.55)/.45);colors.push(c.r,c.g,c.b);}groundGeo.setAttribute('color',new THREE.Float32BufferAttribute(colors,3));groundGeo.computeVertexNormals();
const ground=new THREE.Mesh(groundGeo,new THREE.MeshStandardMaterial({color:0xffffff,vertexColors:true,roughness:1}));ground.receiveShadow=true;scene.add(ground);
// A wide dirt track follows the height profile, making the hill-climb route easy to see.
const roadGeo=new THREE.BufferGeometry(),roadPositions=[],roadIndices=[];const roadSteps=500,roadAcross=8,roadWidth=96;
for(let i=0;i<=roadSteps;i++){const x=-2500+5000*i/roadSteps;for(let j=0;j<=roadAcross;j++){const z=-roadWidth/2+roadWidth*j/roadAcross;roadPositions.push(x,heightAt(x,z)+.8,z);}}
for(let i=0;i<roadSteps;i++)for(let j=0;j<roadAcross;j++){const a=i*(roadAcross+1)+j,b=a+roadAcross+1;roadIndices.push(a,a+1,b,b,a+1,b+1);}
roadGeo.setAttribute('position',new THREE.Float32BufferAttribute(roadPositions,3));roadGeo.setIndex(roadIndices);roadGeo.computeVertexNormals();const road=new THREE.Mesh(roadGeo,new THREE.MeshStandardMaterial({color:0x9a8055,roughness:1,side:THREE.DoubleSide}));road.receiveShadow=true;scene.add(road);
const obstacles=[],trunkMat=new THREE.MeshStandardMaterial({color:0x684528}),leafMats=[0x276b2d,0x347d35,0x1e5927].map(color=>new THREE.MeshStandardMaterial({color}));
function addTree(x,z,s){const tree=new THREE.Group(),trunk=new THREE.Mesh(new THREE.CylinderGeometry(.35*s,.5*s,4*s,8),trunkMat);trunk.position.y=2*s;tree.add(trunk);for(let j=0;j<3;j++){const crown=new THREE.Mesh(new THREE.ConeGeometry((2.3-j*.3)*s,3.8*s,9),leafMats[j%3]);crown.position.y=(4+j*1.5)*s;tree.add(crown);}tree.position.set(x,heightAt(x,z),z);scene.add(tree);obstacles.push({x,z,radius:2.4*s+2,label:'tree'});}
for(let i=0;i<220;i++){const x=(Math.random()-.5)*4700,side=Math.random()<.5?-1:1,z=side*(155+Math.random()*390);if(Math.abs(x)<35&&Math.abs(z)<180)continue;addTree(x,z,.7+Math.random()*.7);}
const rockMat=new THREE.MeshStandardMaterial({color:0x596c43,roughness:1});for(const side of [-1,1])for(let i=0;i<14;i++){const x=-2400+i*365+(Math.random()-.5)*90,z=side*(510+Math.random()*90),h=130+Math.random()*100,w=180+Math.random()*100;const hill=new THREE.Mesh(new THREE.ConeGeometry(w,h,8),rockMat);hill.position.set(x,heightAt(x,z)+h*.38,z);hill.scale.z=1.4;hill.rotation.y=Math.random()*Math.PI;scene.add(hill);obstacles.push({x,z,radius:w*.55+3,label:'rock'});}
// Simple red car, oriented toward +X.
const car=new THREE.Group(),red=new THREE.MeshStandardMaterial({color:0xd50000,metalness:.25,roughness:.36}),black=new THREE.MeshStandardMaterial({color:0x171717,roughness:.8}),glass=new THREE.MeshStandardMaterial({color:0x183648,roughness:.28}),chrome=new THREE.MeshStandardMaterial({color:0xc2c8ca,metalness:.7});
function carBox(w,h,d,mat,x,y,z){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);car.add(m);}carBox(8,2.2,4,red,0,2,0);carBox(4,1.8,3,red,-.2,3.8,0);carBox(.16,1.2,2.8,glass,1.9,3.8,0);for(const side of [-1,1])carBox(3.2,1,.12,glass,0,3.8,side*1.52);
const wheels=[];for(const x of [-2.5,2.5])for(const z of [-2,2]){const wheel=new THREE.Group(),tire=new THREE.Mesh(new THREE.CylinderGeometry(1,1,.7,24),black);tire.rotation.x=Math.PI/2;wheel.add(tire);const rim=new THREE.Mesh(new THREE.CylinderGeometry(.52,.52,.73,20),chrome);rim.rotation.x=Math.PI/2;wheel.add(rim);wheel.position.set(x,1,z);car.add(wheel);wheels.push(wheel);}scene.add(car);
const handle=document.getElementById('slingshotHandle'),status=document.getElementById('slingshotText'),speedText=document.getElementById('speedText'),needle=document.getElementById('needle'),slingTitle=document.getElementById('slingshotTitle');let heading=0,speed=0,dragging=false,launchUsed=false,startX=0,startY=0,pullX=0,pullY=0;const maxPull=55,keys=new Set();
function moveHandle(x,y){handle.style.left=`calc(50% + ${x}px)`;handle.style.top=`calc(50% + ${y}px)`;}function resetCar(){car.position.set(0,heightAt(0,0),0);heading=0;speed=0;car.rotation.set(0,0,0);moveHandle(0,0);speedText.textContent='0 MPH';needle.style.transform='rotate(-130deg)';}resetCar();
handle.addEventListener('pointerdown',e=>{e.preventDefault();if(launchUsed)return;dragging=true;startX=e.clientX;startY=e.clientY;pullX=0;pullY=0;handle.setPointerCapture(e.pointerId);});handle.addEventListener('pointermove',e=>{if(!dragging)return;e.preventDefault();pullX=THREE.MathUtils.clamp(e.clientX-startX,-maxPull,maxPull);pullY=THREE.MathUtils.clamp(e.clientY-startY,-maxPull,maxPull);moveHandle(pullX,pullY);status.textContent=`Launch power: ${Math.round(Math.max(0,pullY)/maxPull*100)}%`;});
function release(){if(!dragging)return;dragging=false;const power=THREE.MathUtils.clamp(pullY/maxPull,0,1),aim=THREE.MathUtils.clamp(pullX/maxPull,-1,1);if(power>.04){launchUsed=true;heading=-aim*.8;speed=22+power*58;handle.style.pointerEvents='none';handle.style.opacity='.45';slingTitle.textContent='LAUNCH USED';status.textContent='One launch used. Steer with A/D or arrows.';}else status.textContent='Pull down and release to launch!';pullX=0;pullY=0;moveHandle(0,0);}handle.addEventListener('pointerup',release);handle.addEventListener('pointercancel',release);
document.getElementById('resetButton').addEventListener('click',()=>{resetCar();status.textContent=launchUsed?'Launch already used. Reload to play again.':'Pull down and release to launch!';});window.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(['a','d','arrowleft','arrowright'].includes(k)){e.preventDefault();keys.add(k);}});window.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));window.addEventListener('blur',()=>keys.clear());
function hitsObstacle(x,z){for(const o of obstacles){const dx=x-o.x,dz=z-o.z,r=o.radius+2.2;if(dx*dx+dz*dz<r*r)return o;}return null;}
const camTarget=new THREE.Vector3(),camDesired=new THREE.Vector3();let lastTime=performance.now();function animate(now){requestAnimationFrame(animate);const dt=Math.min((now-lastTime)/1000,.04);lastTime=now;if(Math.abs(speed)>.015){const slope=slopeAt(car.position.x,car.position.z),along=slope.x*Math.cos(heading)-slope.z*Math.sin(heading);speed+=(-9.8*along-.16*Math.sign(speed))*dt;}else speed=0;speed=THREE.MathUtils.clamp(speed,-12,105);const steer=(keys.has('a')||keys.has('arrowleft')?1:0)-(keys.has('d')||keys.has('arrowright')?1:0);if(steer&&Math.abs(speed)>.2)heading+=steer*1.35*Math.min(1,Math.abs(speed)/7)*dt*(speed<0?-1:1);const moveX=Math.cos(heading)*speed*dt,moveZ=-Math.sin(heading)*speed*dt,steps=Math.max(1,Math.ceil(Math.hypot(moveX,moveZ)/1.5));let collided=null;for(let i=1;i<=steps;i++){const nx=car.position.x+moveX/steps,nz=car.position.z+moveZ/steps;if(Math.abs(nx)>2475||Math.abs(nz)>680){collided={label:'valley edge'};break;}collided=hitsObstacle(nx,nz);if(collided)break;car.position.x=nx;car.position.z=nz;}if(collided){speed=0;status.textContent=`Stopped: hit ${collided.label}. Reset car to try again.`;}car.position.y=heightAt(car.position.x,car.position.z);car.rotation.y=heading;for(const wheel of wheels)wheel.rotation.z-=speed*dt*1.5;const mph=Math.round(Math.abs(speed)*2.237);speedText.textContent=`${mph} MPH`;needle.style.transform=`rotate(${THREE.MathUtils.clamp(-130+mph*2,-130,130)}deg)`;camDesired.set(car.position.x-Math.cos(heading)*25,car.position.y+13,car.position.z+Math.sin(heading)*25);camTarget.set(car.position.x+Math.cos(heading)*10,car.position.y+3,car.position.z-Math.sin(heading)*10);camera.position.lerp(camDesired,1-Math.pow(.002,dt));camera.lookAt(camTarget);renderer.render(scene,camera);}requestAnimationFrame(animate);window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script>
</body>
</html>
